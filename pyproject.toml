[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "private-contract-assistant"
version = "0.1.0"
description = "Privacy-evaluated RAG contract assistant: measures personal-data leakage, citation faithfulness, latency and cost, local LLM vs API, on CUAD with planted synthetic PII."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ahmed Fawaz" }]
requires-python = ">=3.10"
keywords = ["rag", "privacy", "pii", "redaction", "legal-nlp", "cuad", "llm-evaluation", "local-llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "rank-bm25>=0.2.2",
]

[project.optional-dependencies]
ner = ["spacy>=3.7"]
dense = ["sentence-transformers>=2.6"]
local = ["torch>=2.1", "transformers>=4.56"]
api = ["anthropic>=0.40", "openai>=1.40"]
demo = ["gradio>=4.0"]
all = ["private-contract-assistant[ner,dense,local,api,demo]"]
dev = ["pytest>=7.4", "ruff>=0.5"]

[project.scripts]
contract-assistant = "contract_assistant.cli:main"

[project.urls]
Repository = "https://github.com/ahmedfawaz879/private-contract-assistant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "SIM"]
ignore = ["E501", "E731", "SIM108"]
