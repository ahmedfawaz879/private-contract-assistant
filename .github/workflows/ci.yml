name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (core + spaCy NER + dev)
        run: |
          pip install -e ".[ner,dev]"
          python -m spacy download en_core_web_sm
      - name: Lint
        run: ruff check src tests
      - name: Unit and pipeline tests
        run: pytest
      - name: Evaluation gate on committed results
        run: contract-assistant gate --metrics results/tables/table_metrics.csv --rules configs/gate.json
